name: Build Release

on:
  push:
    branches:
      - "compose"
    paths:
      - "CHANGELOG.md"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        product: [ { name: "App原版", value: app } ]

      fail-fast: false
    runs-on: ubuntu-latest
    env:
      product: ${{ matrix.product.value }}
      product_name: ${{matrix.product.value}}
      outputs_dir: "${{ github.workspace }}/app/build/outputs"
      ver_name: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clear Invalid JDK Environment Variables
        run: |
          # 清除可能导致构建失败的无效JDK路径配置
          unset ORG_GRADLE_JAVA_HOME
          echo "ORG_GRADLE_JAVA_HOME=" >> $GITHUB_ENV

      - name: Init Signature
        run: |
          touch local.properties
          echo ALIAS_NAME='${{ secrets.ALIAS_NAME }}' >> local.properties
          echo ALIAS_PASSWORD='${{ secrets.ALIAS_PASSWORD }}' >> local.properties
          echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo KEY_PATH='../key.jks' >> local.properties
          # 从Secrets读取无换行符Base64解码, 然后保存到到key.jks
          echo "DEBUG: Checking GitHub Secrets availability"
          echo "DEBUG: ALIAS_NAME length: ${#ALIAS_NAME}"
          echo "DEBUG: KEY_PASSWORD length: ${#KEY_PASSWORD}"
          echo "DEBUG: KEY_STORE length: ${#KEY_STORE}"
          
          # 生成key.jks文件
          echo ${{ secrets.KEY_STORE }} | base64 --decode > $GITHUB_WORKSPACE/key.jks
          
          echo "DEBUG: Checking generated key.jks file"
          ls -la $GITHUB_WORKSPACE/key.jks
          file $GITHUB_WORKSPACE/key.jks
          
          # 验证key.jks文件是否有效
          echo "DEBUG: Verifying key.jks file with keytool"
          keytool -list -v -keystore $GITHUB_WORKSPACE/key.jks -storetype JKS -storepass ${{ secrets.KEY_PASSWORD }} 2>&1 || echo "WARNING: keytool verification failed, but proceeding with build"
          
          echo "DEBUG: local.properties content"
          cat local.properties

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ env.product }}release --build-cache --parallel --daemon --warning-mode all

      - name: Init environment variable
        run: |
          echo "ver_name=$(grep -m 1 'versionName' ${{ env.outputs_dir }}/apk/${{ env.product }}/release/output-metadata.json | cut -d\" -f4)" >> $GITHUB_ENV

      - name: Upload Mappings to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mappings_${{ env.product }}_${{ env.ver_name }}
          path: ${{ env.outputs_dir }}/mapping/*/*.txt

      - name: Upload APK To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "TTS-Server_${{ env.product }}_${{ env.ver_name }}"
          path: ${{env.outputs_dir}}/apk/${{ env.product }}/release/*${{ env.ver_name }}.apk


      - uses: softprops/action-gh-release@v0.1.15
        with:
          name: ${{ env.ver_name }}
          tag_name: ${{ env.ver_name }}
          body_path: ${{ github.workspace }}/CHANGELOG.md
          draft: false
          prerelease: false
          files: ${{env.outputs_dir}}/apk/${{ env.product }}/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}    
