name: Build Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      outputs_dir: "${{ github.workspace }}/app/build/outputs"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clear Invalid JDK Environment Variables
        run: |
          # 清除可能导致构建失败的无效JDK路径配置
          unset ORG_GRADLE_JAVA_HOME
          echo "ORG_GRADLE_JAVA_HOME=" >> $GITHUB_ENV

      - name: Init Signature
        run: |
          touch local.properties
          echo ALIAS_NAME='${{ secrets.ALIAS_NAME }}' >> local.properties
          echo ALIAS_PASSWORD='${{ secrets.ALIAS_PASSWORD }}' >> local.properties
          echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo KEY_PATH='../key.jks' >> local.properties
          # 从Secrets读取无换行符Base64解码, 然后保存到到key.jks
          echo "DEBUG: Checking GitHub Secrets availability"
          echo "DEBUG: ALIAS_NAME length: ${#ALIAS_NAME}"
          echo "DEBUG: KEY_PASSWORD length: ${#KEY_PASSWORD}"
          echo "DEBUG: KEY_STORE length: ${#KEY_STORE}"
          
          # 生成key.jks文件
          echo ${{ secrets.KEY_STORE }} | base64 --decode > $GITHUB_WORKSPACE/key.jks
          
          echo "DEBUG: Checking generated key.jks file"
          ls -la $GITHUB_WORKSPACE/key.jks
          file $GITHUB_WORKSPACE/key.jks
          
          # 验证key.jks文件是否有效
          echo "DEBUG: Verifying key.jks file with keytool"
          keytool -list -v -keystore $GITHUB_WORKSPACE/key.jks -storetype JKS -storepass ${{ secrets.KEY_PASSWORD }} 2>&1 || echo "WARNING: keytool verification failed, but proceeding with build"
          
          echo "DEBUG: local.properties content"
          cat local.properties

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug --build-cache --parallel --daemon --warning-mode all

      - name: Upload APK To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "TTS-Server_debug"
          path: ${{env.outputs_dir}}/apk/app/debug/*debug.apk
